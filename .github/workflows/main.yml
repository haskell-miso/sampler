name: Build and deploy

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  miso:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: haskell-miso/setup-miso@v1
        with:
          version: v0.1.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cachix
        uses: cachix/cachix-action@v17
        with:
          name: haskell-miso-cachix

      - name: Build WASM using Nix
        run: nix develop .#wasm --command bash -c "make"

      - name: Clean and GC
        run: nix develop .#wasm --command bash -c "make" && nix-collect-garbage -d

      - name: Build MicroHs using Nix
        run: nix develop .#mhs --command bash -c "make mhs"

      - name: Build JS using Nix
        run: nix develop .#ghcjs --command bash -c "make js"

      # - name: Install GHCup
      #   uses: haskell/ghcup-setup@v1
      #   with:
      #     cabal: latest

      # - name: Build WASM using GHCup
      #   run: |
      #     make ghcup-build

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: miso

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
